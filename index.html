<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css"/>   
</head>
<body>

<div class="container fade-in">

    <div class="weather_animation"></div>

    <div class="city-background"></div>

    <div class="weather_container glass">

        <div class="temp">
            <p data-temp>20°</p>
        </div>

        <div class="time_location">
            <p class="city" data-city>Cairo</p>
            <p class="time" data-time>6:30 · Friday 2026-01-23</p>
        </div>

        <div class="condition">
            <img class="weather_icon" alt="weather icon" />
            <p data-condition>Mist</p>
        </div>

        <div class="weather_comment">
            <p data-comment>🤔 Checking the vibe...</p>
        </div>

        <!-- NEW: Weather Stats -->
        <div class="weather_stats">
            <div class="stat_item">
                <div class="stat_label">Feels Like</div>
                <div class="stat_value" data-feelslike>--°</div>
            </div>
            <div class="stat_item">
                <div class="stat_label">Humidity</div>
                <div class="stat_value" data-humidity>--%</div>
            </div>
            <div class="stat_item">
                <div class="stat_label">Wind Speed</div>
                <div class="stat_value" data-wind>-- km/h</div>
            </div>
            <div class="stat_item">
                <div class="stat_label">UV Index</div>
                <div class="stat_value" data-uv>--</div>
            </div>
        </div>

        <!-- NEW: Sun Times -->
        <div class="sun_times">
            <div class="sun_item">
                <div class="sun_icon">🌅</div>
                <div class="sun_info">
                    <p>Sunrise</p>
                    <p data-sunrise>--:--</p>
                </div>
            </div>
            <div class="sun_item">
                <div class="sun_icon">🌇</div>
                <div class="sun_info">
                    <p>Sunset</p>
                    <p data-sunset>--:--</p>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader hidden">
            <span></span>
        </div>

    </div>

    <!-- Search -->
    <nav class="nav">
        <form>
            <div class="search_box">
                <span class="search_icon">🔍</span>
                <input 
                    type="text" 
                    placeholder="Search for a location"
                    class="search_area"
                    autocomplete="off"
                />
            </div>

            <p class="search_hint">
               Try: The Cloud Whisperer🧙‍♂️🔮 🌩️
            </p>
        </form>
    </nav>

    <!-- Footer with your name -->
    <footer class="footer">
        <p>Made by <span class="creator-name">Ali ELHadad</span></p>
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
